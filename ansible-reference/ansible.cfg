# Reference ansible.cfg for the candidate workspace /home/ansible/ansible.
# On the exam you write this yourself - practise typing it from memory.
[defaults]
inventory = /home/ansible/ansible/inventory
remote_user = ansible
roles_path = /home/ansible/ansible/roles:/usr/share/ansible/roles
collections_path = /home/ansible/ansible/collections:/usr/share/ansible/collections
host_key_checking = False
forks = 5
# Uncomment once you have created the vault password file:
# vault_password_file = /home/ansible/ansible/.vault_pass

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False
