# Lab administration config: used by reset/ and validate/ only (via ANSIBLE_CONFIG).
# Your own exam work lives in /home/ansible/ansible with its own ansible.cfg.
[defaults]
inventory = /opt/rhcelab/lab/inventory
remote_user = ansible
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent
forks = 5
timeout = 15
stdout_callback = default
callback_result_format = yaml

[privilege_escalation]
become = False
become_method = sudo
become_user = root

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ConnectTimeout=5
