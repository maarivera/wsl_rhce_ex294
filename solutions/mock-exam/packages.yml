---
- name: Install packages on dev and prod
  hosts: dev,prod
  tasks:
    - name: Install php and mariadb
      ansible.builtin.dnf:
        name:
          - php
          - mariadb
        state: present

- name: Development tooling and updates on dev
  hosts: dev
  tasks:
    - name: Install the RPM Development Tools group
      ansible.builtin.dnf:
        name: "@RPM Development Tools"
        state: present

    - name: Update all packages
      ansible.builtin.dnf:
        name: "*"
        state: latest
