---
# The play targets all hosts so that facts exist for every host in hostvars.
- name: Generate /etc/myhosts on dev
  hosts: all
  tasks:
    - name: Deploy the hosts file
      ansible.builtin.template:
        src: hosts.j2
        dest: /etc/myhosts
        mode: "0644"
      when: "'dev' in group_names"
