---
- name: /etc/issue per environment
  hosts: all
  tasks:
    - name: Development
      ansible.builtin.copy:
        content: "Development\n"
        dest: /etc/issue
        mode: "0644"
      when: "'dev' in group_names"

    - name: Production
      ansible.builtin.copy:
        content: "Production\n"
        dest: /etc/issue
        mode: "0644"
      when: "'prod' in group_names"
